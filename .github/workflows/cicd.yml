name: CICD pipeline
on: 
  push:
jobs:
  code: 
    uses: ./.github/workflows/code.yml  # calling code.yml workflow
  build:
    needs: code
    uses: ./.github/workflows/build.yml
  test:
    needs: build
    uses: ./.github/workflows/test.yml
  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
